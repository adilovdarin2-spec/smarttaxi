<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>SmartTaxi — маркер стартового экрана</title>
<style>
  /* Exact source structure from ClientApp.jsx and styles.css.
     Keep the two SVGs separate: their 3px overlap is part of the marker. */
  .marker {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 48px;
    filter: drop-shadow(0 8px 12px rgba(29, 111, 255, .22));
  }
  .badge { position: relative; z-index: 2; display: block; width: 48px; height: 48px; }
  .tail { position: relative; z-index: 1; display: block; width: 48px; height: 19px; margin-top: -3px; }
</style>
<body>
  <div class="marker" aria-label="Маркер выбора точки SmartTaxi">
    <svg class="badge" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="badgeGradient" x1="4" y1="2" x2="60" y2="60" gradientUnits="userSpaceOnUse">
          <stop stop-color="#63A0FF"/>
          <stop offset="1" stop-color="#0B4FD1"/>
        </linearGradient>
      </defs>
      <rect x="2" y="2" width="60" height="60" rx="20" fill="url(#badgeGradient)"/>
      <rect x="6" y="6" width="52" height="52" rx="16" fill="#FFFFFF" fill-opacity=".88"/>
      <path d="M10 22C10 14 16.5 8 24 6.5" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="14" y="24" width="7" height="7" fill="#63A0FF" opacity=".55"/>
      <rect x="23" y="24" width="7" height="7" fill="#1D6FFF" opacity=".9"/>
      <rect x="18" y="33" width="7" height="7" fill="#63A0FF" opacity=".35"/>
      <text x="42" y="35" text-anchor="middle" dominant-baseline="central" font-family="Manrope, sans-serif" font-weight="800" font-size="29" fill="url(#badgeGradient)">S</text>
    </svg>
    <svg class="tail" viewBox="0 0 64 22" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="tailGradient" x1="32" y1="0" x2="32" y2="22" gradientUnits="userSpaceOnUse">
          <stop stop-color="#1D6FFF"/>
          <stop offset="1" stop-color="#0B4FD1"/>
        </linearGradient>
      </defs>
      <path d="M26 0H38V6L32 22L26 6Z" fill="url(#tailGradient)"/>
    </svg>
  </div>
</body>
</html>
