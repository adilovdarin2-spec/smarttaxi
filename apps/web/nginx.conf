server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Vite changes every asset filename per build. Never let a browser keep an
  # old HTML shell that imports a chunk which no longer exists in the newly
  # deployed container.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  # A missing hashed chunk must be a real 404, not the SPA HTML fallback.
  # Returning index.html here makes dynamic import fail as a blank screen and
  # hides the actual deployment/cache issue from the user.
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / { try_files $uri $uri/ /index.html; }
}
