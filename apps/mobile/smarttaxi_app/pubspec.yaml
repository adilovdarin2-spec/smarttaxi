name: smarttaxi_app
description: SmartTaxi passenger and driver mobile application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_map: ^7.0.2
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.10+1
  geolocator: ^13.0.2
  latlong2: ^0.9.1
  socket_io_client: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/smarttaxi_logo_horizontal.svg
    - assets/brand/smarttaxi_logo_horizontal_transparent.png
    - assets/brand/smarttaxi_app_icon.svg
    - assets/brand/smarttaxi_app_icon_1024.png
    - assets/brand/smarttaxi_icon_foreground_transparent.png
    - assets/brand/smarttaxi_icon_foreground_transparent.svg
    - assets/auth/auth_bg_final.png
    - assets/auth/auth_hero_city_final.png
    - assets/splash/splash_bg_final.png
    - assets/splash/native_splash_no_text.png
    - assets/cars/tariff_economy_white_sedan_flutter.png
    - assets/cars/tariff_comfort_white_sedan_flutter.png
    - assets/cars/tariff_business_white_premium_sedan_flutter.png
    - assets/map/driver_car_topview_white.png
    - assets/map/user_location_marker_blue_gold.png
    - assets/map/destination_pin_gold_white.png
    - assets/map/navigation_button_gold_white.png
