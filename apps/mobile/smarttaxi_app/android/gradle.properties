org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Pre-existing environment quirk, unrelated to any app code: the Flutter
# pub-cache lives on a different drive letter (D:) than this project (C:),
# and Kotlin's incremental compiler crashes trying to relativize paths
# across drives ("this and base files have different roots") when compiling
# plugins with native Kotlin sources (e.g. url_launcher_android). Disabling
# Kotlin incremental compilation avoids that path-relativization step
# entirely; it only makes Kotlin recompiles slightly slower, not broken.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
