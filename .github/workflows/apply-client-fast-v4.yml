name: Apply client fast v4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Patch client map address and UX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/main.jsx')
          s = p.read_text()

          if 'function osmEmbedUrl' not in s:
              s = s.replace('function osmTileImage(center = MAP_CENTER) {', '''function osmEmbedUrl(center = MAP_CENTER) {
  const lat = Number(center?.lat) || MAP_CENTER.lat;
  const lng = Number(center?.lng) || MAP_CENTER.lng;
  const d = 0.028;
  const bbox = (lng - d) + "%2C" + (lat - d) + "%2C" + (lng + d) + "%2C" + (lat + d);
  return "https://www.openstreetmap.org/export/embed.html?bbox=" + bbox + "&layer=mapnik&marker=" + lat + "%2C" + lng;
}

function manualPoint(text) {
  const raw = String(text || "");
  const seed = Array.from(raw).reduce((sum, ch) => sum + ch.charCodeAt(0), 0);
  return {
    lat: (MAP_CENTER.lat + ((seed % 19) - 9) * 0.0012).toFixed(6),
    lng: (MAP_CENTER.lng + ((seed % 23) - 11) * 0.0012).toFixed(6)
  };
}

function osmTileImage(center = MAP_CENTER) {''')

          s = s.replace('<div className="fallback-map dynamic-osm-map" style={{ backgroundImage: osmTileImage(fallbackCenter) }}>\n            <div className="route-line" />', '<div className="fallback-map dynamic-osm-map interactive-osm-map" style={{ backgroundImage: osmTileImage(fallbackCenter) }}>\n            <iframe className="osm-touch-frame" title="OpenStreetMap" src={osmEmbedUrl(fallbackCenter)} loading="lazy" />\n            <div className="route-line" />')

          old = '''function saveManual() {
    setForm(current => ({ ...current, [`${mode}Text`]: value.trim() || current[`${mode}Text`] }));
    onClose();
  }'''
          new = '''function saveManual() {
    const text = value.trim() || form[`${mode}Text`] || (mode === "pickup" ? "Моё местоположение" : "Точка назначения");
    const point = manualPoint(text);
    setForm(current => ({
      ...current,
      [`${mode}Text`]: text,
      [`${mode}Lat`]: current[`${mode}Lat`] || point.lat,
      [`${mode}Lng`]: current[`${mode}Lng`] || point.lng
    }));
    onClose();
  }'''
          s = s.replace(old, new)

          s = s.replace('const disabled = !form.riderPhone.trim() || !form.pickupText.trim() || !form.dropoffText.trim() || loading;', 'const phoneReady = String(form.riderPhone || "").replace(/\\D/g, "").length >= 6;\n  const disabled = !phoneReady || !form.pickupText.trim() || !form.dropoffText.trim() || loading;')
          s = s.replace('<span>{hasRealMap ? mapStatus : mapFailure ? "Карта работает в fallback режиме" : "OpenStreetMap"}</span>', '<span>{hasRealMap ? mapStatus : "Карту можно двигать пальцем"}</span>')
          s = s.replace('<button type="button">Поделиться поездкой</button>\n          ', '')
          s = s.replace('disabled ? "Укажите маршрут и телефон" : `Заказать за ${approxPrice ? `~${money(approxPrice)}` : "расчётную цену"}`', 'disabled ? "Заполните маршрут и телефон" : `Заказать за ${approxPrice ? `~${money(approxPrice)}` : "расчётную цену"}`')
          p.write_text(s)

          cssp = Path('apps/web/src/styles.css')
          c = cssp.read_text()
          if 'SmartTaxi client fast v4' not in c:
              c += '''

/* SmartTaxi client fast v4 */
.interactive-osm-map { background:#07100d !important; overflow:hidden; touch-action:pan-x pan-y !important; }
.osm-touch-frame { position:absolute; inset:-10%; width:120%; height:120%; border:0; z-index:1; filter:grayscale(1) invert(.92) contrast(1.08) brightness(.74) sepia(.12); opacity:.78; pointer-events:auto; }
.interactive-osm-map .route-line,
.interactive-osm-map .pin,
.interactive-osm-map .map-grid,
.interactive-osm-map .fallback-label { z-index:3; pointer-events:none; }
.route-overlay { left:14px !important; right:14px !important; bottom:12px !important; pointer-events:none !important; }
.map-locate-btn { display:none !important; }
.client-screen .route-preview { min-height:44vh; }
.ride-sheet { gap:10px !important; padding-bottom:18px !important; }
.ride-details { display:none !important; }
.trip-actions button:nth-child(2) { display:none !important; }
@media (max-width:430px){
  .client-screen .route-preview{min-height:43vh;}
  .route-picks button{padding:12px !important;}
  .tariff-pill{min-width:118px !important;}
  .payment-strip button{min-width:104px !important;}
}
'''
          cssp.write_text(c)
          PY

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'function osmEmbedUrl' apps/web/src/main.jsx
          grep -n 'manualPoint' apps/web/src/main.jsx
          grep -n 'osm-touch-frame' apps/web/src/main.jsx
          grep -n 'phoneReady' apps/web/src/main.jsx
          grep -n 'SmartTaxi client fast v4' apps/web/src/styles.css
          if grep -n 'return ;' apps/web/src/main.jsx; then exit 1; fi

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name smarttaxi-bot
          git config user.email smarttaxi-bot@users.noreply.github.com
          git add apps/web/src/main.jsx apps/web/src/styles.css
          git commit -m "Improve client map address and order UX" || true
          git push origin dev
