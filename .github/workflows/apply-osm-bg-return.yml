name: Apply OSM background return

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Patch OSM background return
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/main.jsx')
          s = p.read_text()
          old = '  return "";'
          new = '  return "linear-gradient(180deg, rgba(5,5,5,.08), rgba(5,5,5,.78)), url(" + ["https:", "", "tile.openstreetmap.org", z, x, y + ".png"].join("/") + ")";'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'tile.openstreetmap.org' apps/web/src/main.jsx
          if grep -n 'return ;' apps/web/src/main.jsx; then exit 1; fi
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name smarttaxi-bot
          git config user.email smarttaxi-bot@users.noreply.github.com
          git add apps/web/src/main.jsx
          git commit -m "Return dynamic OSM tile background" || true
          git push origin dev
