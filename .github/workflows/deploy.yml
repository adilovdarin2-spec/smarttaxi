name: Deploy SmartTaxi to VPS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - main
      rebuild:
        description: "Rebuild Docker images"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: smarttaxi-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to SmartTaxi VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.VPS_HOST }}" || (echo "VPS_HOST is missing" && exit 1)
          test -n "${{ secrets.VPS_USER }}" || (echo "VPS_USER is missing" && exit 1)
          test -n "${{ secrets.VPS_PORT }}" || (echo "VPS_PORT is missing" && exit 1)
          test -n "${{ secrets.VPS_PATH }}" || (echo "VPS_PATH is missing" && exit 1)
          test -n "${{ secrets.VPS_SSH_KEY }}" || (echo "VPS_SSH_KEY is missing" && exit 1)

      - name: Prepare SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/smarttaxi_deploy_key
          chmod 600 ~/.ssh/smarttaxi_deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.inputs.branch }}"
          REBUILD="${{ github.event.inputs.rebuild }}"

          ssh -i ~/.ssh/smarttaxi_deploy_key \
            -p "${{ secrets.VPS_PORT }}" \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "BRANCH='$BRANCH' REBUILD='$REBUILD' VPS_PATH='${{ secrets.VPS_PATH }}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$VPS_PATH"

          echo "=== SmartTaxi deploy ==="
          echo "path=$(pwd)"
          echo "branch=$BRANCH"
          echo "rebuild=$REBUILD"

          echo "=== Before ==="
          git status --short
          echo "current_branch=$(git branch --show-current)"
          PREV_COMMIT=$(git rev-parse --short HEAD)
          echo "rollback_commit=$PREV_COMMIT"
          echo "$PREV_COMMIT" > /root/smarttaxi_rollback_commit.txt

          echo "=== Docker before ==="
          docker compose ps
          docker compose config --quiet

          echo "=== Update repo ==="
          git fetch origin
          git checkout "$BRANCH"
          git pull --ff-only origin "$BRANCH"
          DEPLOYED_COMMIT=$(git rev-parse --short HEAD)
          echo "deployed_commit=$DEPLOYED_COMMIT"

          echo "=== Build/start ==="
          docker compose config --quiet
          if [ "$REBUILD" = "true" ]; then
            docker compose build --no-cache web api
          fi
          docker compose up -d web api

          echo "=== Wait services ==="
          sleep 10
          docker compose ps

          echo "=== Health checks ==="
          curl -fsS http://127.0.0.1:4000/api/health >/tmp/smarttaxi_health.json
          cat /tmp/smarttaxi_health.json
          echo
          curl -fsS http://127.0.0.1:4000/api/health/ready >/tmp/smarttaxi_ready.json
          cat /tmp/smarttaxi_ready.json
          echo

          echo "=== Recent logs ==="
          docker compose logs --tail=80 web api

          echo "=== Deploy done ==="
          echo "rollback_commit=$PREV_COMMIT"
          echo "deployed_commit=$DEPLOYED_COMMIT"
          REMOTE
