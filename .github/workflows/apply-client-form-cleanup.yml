name: Apply client form cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Remove noisy client fields
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e 's/\n      <details className="ride-details">.*?<\/details>//s' apps/web/src/main.jsx
          perl -0pi -e 's/\n        <input value=\{form\.riderName\}[^\n]*placeholder="Имя" \/>//g' apps/web/src/main.jsx
          if ! grep -q "SmartTaxi form cleanup" apps/web/src/styles.css; then
            echo "" >> apps/web/src/styles.css
            echo "/* SmartTaxi form cleanup */" >> apps/web/src/styles.css
            echo ".ride-details { display: none !important; }" >> apps/web/src/styles.css
            echo ".phone-row { margin-top: 2px; }" >> apps/web/src/styles.css
          fi

      - name: Verify form cleanup
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n 'placeholder="Имя"' apps/web/src/main.jsx
          grep -n 'SmartTaxi form cleanup' apps/web/src/styles.css

      - name: Commit form cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name smarttaxi-bot
          git config user.email smarttaxi-bot@users.noreply.github.com
          git add apps/web/src/main.jsx apps/web/src/styles.css
          git commit -m "Remove noisy client order fields" || true
          git push origin dev
