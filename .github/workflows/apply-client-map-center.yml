name: Apply client map center

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Center OSM fallback by real coordinates
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('apps/web/src/main.jsx'); s=p.read_text(); marker='function MapExperience({ form, estimate, order, driverLocation, locating, locationOk, onLocate, compact = false }) {'; helper='function osmTileImage(center = MAP_CENTER) {\n  const lat = Number(center?.lat) || MAP_CENTER.lat;\n  const lng = Number(center?.lng) || MAP_CENTER.lng;\n  const z = 15;\n  const scale = 2 ** z;\n  const x = Math.floor((lng + 180) / 360 * scale);\n  const y = Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * scale);\n  return `linear-gradient(180deg, rgba(5,5,5,.08), rgba(5,5,5,.78)), url(https://tile.openstreetmap.org/${z}/${x}/${y}.png)`;\n}\n\n'; s=s.replace(marker, helper+marker) if 'function osmTileImage' not in s else s; s=s.replace('const mapStatus = mapCopy(order, driverLocation, estimate);','const mapStatus = mapCopy(order, driverLocation, estimate);\n  const fallbackCenter = driverPoint || pickup || dropoff || MAP_CENTER;'); s=s.replace('<div className=\"fallback-map\">','<div className=\"fallback-map dynamic-osm-map\" style={{ backgroundImage: osmTileImage(fallbackCenter) }}>'); p.write_text(s)"
          if ! grep -q "SmartTaxi dynamic OSM center" apps/web/src/styles.css; then
            echo "" >> apps/web/src/styles.css
            echo "/* SmartTaxi dynamic OSM center */" >> apps/web/src/styles.css
            echo ".dynamic-osm-map { background-size: cover !important; background-position: center !important; }" >> apps/web/src/styles.css
            echo ".dynamic-osm-map::after { content: \"\"; position: absolute; inset: 0; background: radial-gradient(circle at 50% 42%, rgba(245,197,66,.12), transparent 30%); pointer-events: none; }" >> apps/web/src/styles.css
          fi
      - name: Verify map center
        run: |
          grep -n "osmTileImage" apps/web/src/main.jsx
          grep -n "dynamic-osm-map" apps/web/src/main.jsx
      - name: Commit map center
        run: |
          git config user.name smarttaxi-bot
          git config user.email smarttaxi-bot@users.noreply.github.com
          git add apps/web/src/main.jsx apps/web/src/styles.css
          git commit -m "Center fallback OSM map by coordinates" || true
          git push origin dev
