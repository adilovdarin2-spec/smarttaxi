name: Fix OSM tile return

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Patch broken map helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/main.jsx')
          text = path.read_text()
          bad = '  return' + ' ;'
          good = '  return "";'
          if bad not in text:
              raise SystemExit('target not found')
          path.write_text(text.replace(bad, good, 1))
          PY

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'return "";' apps/web/src/main.jsx

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name smarttaxi-bot
          git config user.email smarttaxi-bot@users.noreply.github.com
          git add apps/web/src/main.jsx
          git commit -m "Fix broken OSM tile helper" || true
          git push origin dev
